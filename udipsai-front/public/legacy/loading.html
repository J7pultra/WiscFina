<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UDIPSAI · Iniciando...</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* ── Fondo animado ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%,   rgba(8,145,178,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 100%, rgba(14,165,233,0.10) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── Logo / Ícono ── */
    .logo-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 32px;
      animation: floatIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    .logo-bg {
      width: 110px;
      height: 110px;
      border-radius: 26px;
      background: linear-gradient(135deg, #7b2020 0%, #9b2c2c 100%);
      box-shadow: 0 0 40px rgba(8,145,178,0.45), 0 8px 32px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon {
      font-size: 52px;
      line-height: 1;
    }

    /* Anillo giratorio alrededor del logo */
    .logo-ring {
      position: absolute;
      inset: -8px;
      border-radius: 34px;
      border: 2px solid transparent;
      border-top-color: rgba(8,145,178,0.7);
      border-right-color: rgba(8,145,178,0.3);
      animation: spin 1.4s linear infinite;
    }

    /* ── Textos ── */
    .app-name {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f1f5f9;
      animation: fadeUp 0.5s 0.2s both;
    }

    .app-name span {
      color: #7b2020;
    }

    .app-subtitle {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      animation: fadeUp 0.5s 0.3s both;
    }

    /* ── Barra de progreso ── */
    .progress-wrap {
      margin-top: 48px;
      width: 260px;
      animation: fadeUp 0.5s 0.4s both;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #475569;
      margin-bottom: 8px;
    }

    .progress-track {
      height: 4px;
      background: rgba(255,255,255,0.07);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #7b2020, #9b2c2c, #c24141);
      background-size: 200% 100%;
      animation: progressFill 4s cubic-bezier(0.4,0,0.2,1) forwards,
                 shimmer 1.5s linear infinite;
      width: 0%;
    }

    /* ── Puntos de estado ── */
    .status-dots {
      margin-top: 24px;
      display: flex;
      gap: 6px;
      animation: fadeUp 0.5s 0.5s both;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #334155;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* ── Footer ── */
    .footer {
      position: fixed;
      bottom: 24px;
      font-size: 0.68rem;
      color: #1e293b;
      letter-spacing: 0.04em;
      animation: fadeUp 0.5s 0.6s both;
    }

    /* ── Keyframes ── */
    @keyframes floatIn {
      from { opacity: 0; transform: scale(0.7) translateY(20px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes progressFill {
      0%   { width: 0%; }
      20%  { width: 30%; }
      50%  { width: 62%; }
      80%  { width: 85%; }
      100% { width: 97%; }
    }
    @keyframes shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
    @keyframes dotPulse {
      0%, 80%, 100% { background: #334155; transform: scale(1); }
      40%            { background: #7b2020; transform: scale(1.4); }
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <div class="logo-bg">
      <span class="logo-icon">🧠</span>
    </div>
    <div class="logo-ring"></div>
  </div>

  <h1 class="app-name">UDI<span>PSAI</span></h1>
  <p class="app-subtitle">Sistema de Evaluación Clínica</p>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="status-text">Iniciando sistema...</span>
      <span id="pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="pbar"></div>
    </div>
  </div>

  <div class="status-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <p class="footer">WISC-V · WPPSI-IV &nbsp;|&nbsp; v2.0.0</p>

  <script>
    // Simular progreso visual mientras el servidor arranca
    const statuses = [
      { t: 200,  pct: 10, msg: 'Iniciando sistema...' },
      { t: 800,  pct: 30, msg: 'Cargando base de datos...' },
      { t: 2000, pct: 60, msg: 'Preparando módulos clínicos...' },
      { t: 3200, pct: 80, msg: 'Configurando servidor...' },
      { t: 4500, pct: 95, msg: 'Casi listo...' },
    ];

    const bar  = document.getElementById('pbar');
    const pct  = document.getElementById('pct');
    const stxt = document.getElementById('status-text');

    statuses.forEach(({ t, pct: p, msg }) => {
      setTimeout(() => {
        bar.style.width = p + '%';
        pct.textContent = p + '%';
        stxt.textContent = msg;
      }, t);
    });
  </script>
</body>
</html>
